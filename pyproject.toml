[project]
name = "getexp-python-workspace"
version = "0.1.0"
description = "GetExp framework — Python workspace root (tooling + shared config)."
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["python/getexp-core", "apps/reference-api-py"]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.0",
    "ruff>=0.15.0",
    "mypy>=2.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# A curated, opinionated rule set — the "paved road" for Python style/quality.
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["python", "apps"]

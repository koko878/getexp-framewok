[project]
name = "__APP_NAME__"
version = "0.1.0"
description = "GetExp FastAPI service."
requires-python = ">=3.11"
dependencies = [
    "getexp-core",
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.48.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.0",
]

[tool.uv.sources]
getexp-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "getexp-core"
version = "0.1.0"
description = "GetExp shared building blocks: result, errors, logger, config, resilient http, idempotency."
requires-python = ">=3.11"
dependencies = [
    "structlog>=25.5.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["getexp_core"]
